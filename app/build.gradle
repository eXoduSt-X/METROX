apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'
apply plugin: "androidx.navigation.safeargs.kotlin"
apply plugin: 'kotlin-parcelize'
apply plugin: 'com.google.devtools.ksp'

android {
    compileSdk 34 // Actualizado a 34
    namespace "code.name.monkey.retromusic"

    defaultConfig {
        minSdk 21
        targetSdk 34 // Actualizado a 34
        vectorDrawables.useSupportLibrary = true
        applicationId 'io.github.muntashirakon.Music'
        versionCode 10603
        versionName '6.1.0'
        multiDexEnabled true
    }

    buildTypes {
        release {
            shrinkResources true
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix ' DEBUG'
        }
    }

    buildFeatures {
        viewBinding true
        dataBinding false
    }

    packagingOptions {
        resources {
            excludes += ['META-INF/LICENSE', 'META-INF/NOTICE', 'META-INF/java.properties']
            excludes += 'META-INF/services/org.mozilla.javascript.ContextFactory'
            excludes += 'META-INF/services/org.mozilla.javascript.ScriptableObject'
            excludes += 'META-INF/services/org.mozilla.javascript.internal.*'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11 // Actualizado a 11
        targetCompatibility JavaVersion.VERSION_11
    }

    kotlinOptions {
        jvmTarget = "11" // Actualizado a 11
    }
}

configurations.all {
    resolutionStrategy {
        force 'com.google.code.findbugs:jsr305:3.0.2'
        force 'org.mozilla:rhino:1.7.14'
        
        force "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
        force "org.jetbrains.kotlin:kotlin-reflect:$kotlin_version"
        
        // Actualizado a 1.7.3 para compatibilidad con Kotlin 1.9.20
        force 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.7.3'
        force 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
    }
}

dependencies {
    implementation project(':appthemehelper')
    // ... (Mantén tus otras dependencias igual)

    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3"

    // ACTUALIZADO: Glide 4.16.0 para evitar el error de generación de código
    def glide_version = '4.16.0'
    implementation "com.github.bumptech.glide:glide:$glide_version"
    ksp "com.github.bumptech.glide:ksp:$glide_version"
    
    // ... (El resto de tus dependencias permanecen igual)
    implementation 'com.github.TeamNewPipe:NewPipeExtractor:v0.25.0'
    implementation 'org.mozilla:rhino:1.7.14'
}

