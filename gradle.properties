android.injected.testOnly=false
android.useAndroidX=true
kotlin.code.style=official
org.gradle.caching=true
org.gradle.jvmargs=-Xmx4g -XX:+UseParallelGC -Dfile.encoding=UTF-8
org.gradle.parallel=true

# https://developer.android.com/studio/build/optimize-your-build#use-non-transitive-r-classes
android.nonTransitiveRClass=true
# https://blog.jetbrains.com/kotlin/2022/07/a-new-approach-to-incremental-compilation-in-kotlin/
kotlin.incremental.useClasspathSnapshot=true

# CORRECCIÓN: Desactivamos configureondemand y configuration-cache para asegurar estabilidad en GitHub Actions con AIDL
org.gradle.configureondemand=false
org.gradle.unsafe.configuration-cache=false

# TRUCO FINAL: Apaga la telemetría y obliga a Gradle a continuar el build aunque falle el recolector de estadísticas de Kotlin
kotlin.statistics.enabled=false
org.gradle.warning.mode=none
