name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      
      # AGREGA ESTO TAMBIÉN EN CHECK
      - name: Download FFmpegKit
        run: |
          mkdir -p app/libs
          curl -L https://github.com/arthenica/ffmpeg-kit/releases/download/v6.0.2/ffmpeg-kit-min-gpl-6.0.2.aar -o app/libs/ffmpeg-kit-min.aar
          
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Validate Gradle Wrapper
        run: chmod +x ./gradlew
      - name: Lint Android
        run: ./gradlew lint

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: check
    steps:
      - uses: actions/checkout@v4
      
      # 1. Borrar caché de transformaciones de Gradle
      - name: Clean Gradle Cache
        run: rm -rf /home/runner/.gradle/caches/transforms-3

      # 2. Descargar FFmpegKit
      - name: Download FFmpegKit
        run: |
          mkdir -p app/libs
          curl -L https://github.com/arthenica/ffmpeg-kit/releases/download/v6.0.2/ffmpeg-kit-min-gpl-6.0.2.aar -o app/libs/ffmpeg-kit-min.aar
          
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'
      - uses: gradle/actions/setup-gradle@v4
      - name: Make gradlew executable
        run: chmod +x ./gradlew
      - name: Build
        run: ./gradlew app:assemble

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: METROX-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
