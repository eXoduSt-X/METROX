// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    ext {
        // ACTUALIZADO: Kotlin 1.9.20 para compatibilidad con KSP y Glide
        kotlin_version = '1.9.20'
        
        lifecycle_version = '2.6.1'
        navigation_version = '2.5.3'
        mdc_version = '1.9.0-beta01'
        preference_version = '1.2.0'
        appcompat_version = '1.6.1'
        core_version = '1.10.0-rc01'
    }

    repositories {
        mavenCentral()
        google()
    }
    dependencies {
        // ACTUALIZADO: Gradle 8.1.0 para soportar las nuevas versiones de Kotlin
        classpath 'com.android.tools.build:gradle:8.1.0'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
        classpath "androidx.navigation:navigation-safe-args-gradle-plugin:$navigation_version"
    }
}

plugins {
    id "com.github.ben-manes.versions" version "0.46.0"
    // ACTUALIZADO: Versión de KSP que corresponde exactamente a Kotlin 1.9.20
    id 'com.google.devtools.ksp' version '1.9.20-1.0.13' apply false
}

tasks.register('clean', Delete) {
    delete rootProject.buildDir
}
