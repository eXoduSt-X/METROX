// https://docs.gradle.org/enterprise/gradle-plugin/
plugins {
    id "com.gradle.enterprise" version "3.10.3"
}

gradleEnterprise {
    buildScan {
        termsOfServiceUrl = "https://gradle.com/terms-of-service"
        termsOfServiceAgree = "yes"
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
        
        // CORRECCIÓN: Dejamos solo JitPack público centralizado. 
        // Ya no se requiere autenticación porque la app busca el tag 'v0.25.0' directamente aquí.
        maven { url "https://jitpack.io" }
    }
}

include ':app', ':appthemehelper'
